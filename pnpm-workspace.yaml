# Standalone install root: this plugin is its own pnpm project, so a bare
# `pnpm install` here never walks up into another checkout's workspace.
autoInstallPeers: false
allowBuilds:
  esbuild: true

# Exact new Host peers retain their real registry creation timestamps.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.6-alpha.1'
  - '@deepseek-ai/cosmokit@1.8.7-alpha.1'
  - '@deepseek-ai/schemastery@3.18.6-alpha.1'
  - 'dsh-better-sidebar@0.28.2-vh.4'
